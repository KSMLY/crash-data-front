<aside class="sidebar">
  <div class="brand">
    <span class="brand-icon material-symbols-outlined">shield</span>
    <div>
      <div class="brand-name">Crash Data</div>
    </div>
  </div>

  <nav>
    @for (n of nav; track n.path) {
      <a
        [routerLink]="n.path"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: n.exact }"
      >
        <span class="material-symbols-outlined">{{ n.icon }}</span
        >{{ n.label }}
      </a>
    }
  </nav>

  <div class="user">
    <div class="avatar">{{ initials() }}</div>
    <div class="user-text">
      <div class="user-name">{{ email() }}</div>
      <div class="user-role">Road safety analyst</div>
    </div>
    <button
      type="button"
      class="sign-out"
      (click)="signOut()"
      aria-label="Sign out"
      title="Sign out"
    >
      <span class="material-symbols-outlined">logout</span>
    </button>
  </div>
</aside>

<main>
  <router-outlet />
</main>
