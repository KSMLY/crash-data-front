<app-page-header
  title="Crashes"
  description="Search the crash register and open a record to check its details."
/>
<table mat-table [dataSource]="crashes()">
  <ng-container matColumnDef="policeRef">
    <th mat-header-cell *matHeaderCellDef>Police Ref</th>
    <td mat-cell *matCellDef="let c">{{ c.policeRef }}</td>
  </ng-container>

  <ng-container matColumnDef="crashDate">
    <th mat-header-cell *matHeaderCellDef>Date</th>
    <td mat-cell *matCellDef="let c">{{ c.crashDate }}</td>
  </ng-container>

  <ng-container matColumnDef="district">
    <th mat-header-cell *matHeaderCellDef>District</th>
    <td mat-cell *matCellDef="let c">{{ c.district.nameEn }}</td>
  </ng-container>

  <ng-container matColumnDef="severity">
    <th mat-header-cell *matHeaderCellDef>Severity</th>
    <td mat-cell *matCellDef="let c">{{ c.severity }}</td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="columns"></tr>
  <tr mat-row *matRowDef="let row; columns: columns"></tr>
</table>
